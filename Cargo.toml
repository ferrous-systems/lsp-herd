[package]
name = "lsp-herd"
version = "0.3.0"
description = "share one language server instance between multiple LSP clients to save resources"
repository = "https://github.com/ferrous-systems/lsp-herd"
license = "EUPL-1.2"
edition = "2021"

[dependencies]
anyhow = "1.0.53"
clap = { version = "4.3.0", features = ["derive", "env", "error-context", "help", "std", "usage"], default-features = false }
directories = "4.0.1"
glob = "0.3.3"
percent-encoding = "2.3.1"
pin-project-lite = "0.2.14"
serde = { version = "1.0.186", features = ["derive"] }
serde_json = "1.0.78"
tokio = { version = "1.37.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.5.8"
tracing = "0.1.39"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "fmt"], default-features = false }
uriparse = "0.6.4"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
